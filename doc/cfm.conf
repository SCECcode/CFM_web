Listen 8081

<Directory /app/web>
    Options Indexes FollowSymLinks Includes ExecCGI
    AllowOverride All
    Require all granted
    RewriteEngine On
    RewriteRule ^explorer$ explorer.php [L]
    RewriteRule ^guide$ guide.php [L]
    RewriteRule ^contact$ contact.php [L]
    RewriteRule ^disclaimer$ disclaimer.php [L]
    RewriteRule ^cite$ how-to-cite.php [L]
</Directory>

<VirtualHost *:8081>
    ServerAdmin user@localhost
    DocumentRoot /app/web
    ErrorLog "/app/error_log"
    # AccessLog "/app/access_log"

    # Forward all PHP requests to the PHP-FPM Unix socket
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
    </FilesMatch>
</VirtualHost>
